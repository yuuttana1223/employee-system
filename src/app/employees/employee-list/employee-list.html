<h1>従業員一覧</h1>
@for (employee of employees; track employee.id) {
  <section>
    <p>名前: {{ employee.name }}</p>
    <p>部署: {{ employee.department }}</p>
    <p>役職: {{ employee.position }}</p>
    <a [routerLink]="['/employees', employee.id]">詳細を見る</a>
  </section>
} @empty {
  <p>従業員が登録されていません</p>
}
