<h1>従業員一覧</h1>
<label for="employee-keyword">従業員名で検索</label>
<input
  id="employee-keyword"
  type="search"
  [value]="keyword()"
  (input)="updateKeyword($event.target.value)"
/>
<p>検索キーワード: {{ keyword() }}</p>
@for (employee of employees; track employee.id) {
  <section>
    <p>名前: {{ employee.name }}</p>
    <p>部署: {{ employee.department }}</p>
    <p>役職: {{ employee.position }}</p>
    @if (employee.status === 'active') {
      <p>ステータス: 在籍中</p>
    } @else {
      <p>ステータス: 退職済み</p>
    }
    <a [routerLink]="['/employees', employee.id]">詳細を見る</a>
  </section>
} @empty {
  <p>従業員が登録されていません</p>
}
