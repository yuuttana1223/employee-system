<h1>従業員編集</h1>

<form [formGroup]="editForm">
  <label for="employee-name">氏名</label>

  <input id="employee-name" type="text" formControlName="name" />

  @if (
    editForm.controls.name.invalid &&
    (editForm.controls.name.dirty || editForm.controls.name.touched)
  ) {
    @if (editForm.controls.name.hasError('required')) {
      <p>氏名は必須です</p>
    }
  }

  <label for="employee-department">部署</label>

  <select id="employee-department" formControlName="department">
    <option value="">選択してください</option>
    <option value="開発部">開発部</option>
    <option value="人事部">人事部</option>
    <option value="営業部">営業部</option>
  </select>
</form>

<p>氏名: {{ editForm.controls.name.value }}</p>

<p>部署: {{ editForm.controls.department.value }}</p>
